name: 🖥️ Free VPS
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 🚀 Boot Free VPS
        run: |
          echo "⚡ Installing SSH + Web Terminal..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server ttyd curl wget > /dev/null 2>&1

          # Configure SSH
          echo "runner:freessh2026" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config 2>/dev/null
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config 2>/dev/null
          sudo service ssh start
          echo "✅ SSH ready (runner / freessh2026)"

          # Ngrok SSH tunnel (card verified, enterprise stable)
          echo "🔌 Installing ngrok..."
          curl -sL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz
          echo "✅ Downloaded"
          ./ngrok config add-authtoken 3DysA574po9uNBLKCvcCaItsYtP_5jo2TTMjKHviztWiiTwdJ 2>&1
          echo "✅ Ngrok ready"
          
          echo "🔌 Starting ngrok TCP tunnel for SSH..."
          ./ngrok tcp 22 --log stdout --log-level info > /tmp/ngrok.log 2>&1 &
          sleep 6
          
          set +e
          SSH_URL=$(grep -o 'url=tcp://[^ ]*' /tmp/ngrok.log | head -1 | cut -d= -f2)
          [ -z "$SSH_URL" ] && SSH_URL=$(curl -s http://localhost:4040/api/tunnels 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['tunnels'][0]['public_url'])" 2>/dev/null)
          SSH_ADDR=$(echo "$SSH_URL" | sed 's|tcp://||')
          set -e
          
          [ -z "$SSH_ADDR" ] && SSH_ADDR="check_log"
          echo "✅ SSH tunnel: ${SSH_ADDR}" | tee /tmp/ssh_addr.txt

          # Install cloudflared
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          echo "✅ Cloudflared installed"

          # Start web terminal on port 8080
          ttyd -p 8080 bash &
          sleep 2
          echo "✅ Web terminal on port 8080"

          # Expose via Cloudflare Tunnel
          echo "🌐 Creating tunnel..."
          ./cloudflared tunnel --url http://localhost:8080 2>&1 | tee /tmp/cf.log &
          sleep 12

          # Wait for SSH tunnel address
          for i in $(seq 1 10); do
            SSH_ADDR=$(cat /tmp/ssh_addr.txt 2>/dev/null | grep -oE '[a-zA-Z0-9.-]+\.ngrok[^ ]*:[0-9]+' | head -1)
            [ -z "$SSH_ADDR" ] && SSH_ADDR=$(cat /tmp/ssh_addr.txt 2>/dev/null | grep -oE '[a-zA-Z0-9.-]+:[0-9]+' | head -1)
            [ -n "$SSH_ADDR" ] && break
            sleep 2
          done
          SSH_ADDR="${SSH_ADDR:-unknown}"

          URL=$(grep -o 'https://[^ ]*trycloudflare.com' /tmp/cf.log | head -1)
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║        🖥️  YOUR FREE VPS IS READY!           ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  🔗 URL : $URL"
          echo "║  🔌 SSH : ssh runner@${SSH_ADDR}"
          echo "║  👤 User: runner"
          echo "║  🔑 Pass: freessh2026"
          echo "║  ⏰ Life: 6 hours (till $(date -d '+6 hours' '+%H:%M UTC'))"
          echo "║  💾 RAM : 16GB | CPU: 4 cores | Disk: 14GB"
          echo "╚══════════════════════════════════════════════╝"
          echo ""
          
          # ===== OLLAMA: Install + Model (SSH local access only) =====
          echo "🦙 Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          echo "📥 Downloading Llama-3.1-8B-abliterated (4.9GB)..."
          wget -q -O /tmp/llama-model.gguf https://hf-mirror.com/mlabonne/Meta-Llama-3.1-8B-Instruct-abliterated-GGUF/resolve/main/meta-llama-3.1-8b-instruct-abliterated.Q4_K_M.gguf
          echo "FROM /tmp/llama-model.gguf" > /tmp/Modelfile
          ollama create llama3.1:abliterated -f /tmp/Modelfile
          echo "🚀 Starting Ollama API on 0.0.0.0:11434..."
          pkill ollama 2>/dev/null; sleep 1
          OLLAMA_HOST=0.0.0.0:11434 ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3
          curl -s http://localhost:11434/api/tags | python3 -c "import sys,json; print('✅ Ollama ready: '+str(len(json.load(sys.stdin).get('models',[])))+' models')" 2>/dev/null || echo '⚠️ Ollama check failed'

          # Wait for ngrok to stabilize and get the real address
          REAL_ADDR=""
          for i in $(seq 1 20); do
            REAL_ADDR=$(curl -s http://localhost:4040/api/tunnels 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["tunnels"][0]["public_url"].replace("tcp://",""))' 2>/dev/null)
            [ -n "$REAL_ADDR" ] && break
            echo "⏳ Waiting for ngrok tunnel... ($i/20)"
            sleep 3
          done
          [ -z "$REAL_ADDR" ] && REAL_ADDR="unknown"
          echo "🔌 Final address: ${REAL_ADDR}"
          
          # Push SSH address to repo via REST API
          FILE_SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/mjiangyuchn-cloud/free-vps/contents/ssh_addr.txt" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null)
          PAYLOAD=$(python3 -c "import json,base64,sys; a=sys.argv[1]; b={"message":"VPS: "+a,"content":base64.b64encode(a.encode()).decode()}; [b.pop("sha",None) and b.update({"sha":sys.argv[2]}) for _ in [0] if sys.argv[2]]; print(json.dumps(b))" "${REAL_ADDR}" "${FILE_SHA}")
          curl -s -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -d "${PAYLOAD}" "https://api.github.com/repos/mjiangyuchn-cloud/free-vps/contents/ssh_addr.txt"
          echo ""
          # Keep alive for 6 hours
          echo "⏳ Keeping alive..."
          sleep 21000
